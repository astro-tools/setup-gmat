site_name: setup-gmat
site_description: GitHub Action to install NASA GMAT and bootstrap gmatpy in CI.
site_url: https://astro-tools.github.io/setup-gmat/
repo_url: https://github.com/astro-tools/setup-gmat
repo_name: astro-tools/setup-gmat
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Inputs and outputs: inputs-outputs.md
  - Recipes:
      - recipes/index.md
      - Run pytest against gmatpy: recipes/pytest.md
      - Run a mission script and upload its report: recipes/run-mission-script.md
      - Skip the GMAT install on docs-only changes: recipes/skip-on-docs.md
  - FAQ: faq.md
  - Troubleshooting: troubleshooting.md

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/astro-tools/setup-gmat
