name: Manual platform test

# Cross-platform verification harness. Triggered manually to confirm setup-gmat
# works on a chosen runner OS × GMAT version pairing without bloating the
# per-PR CI matrix. The cross-platform self-CI matrix is tracked separately.

on:
  workflow_dispatch:
    inputs:
      runs-on:
        description: 'Runner image'
        required: true
        default: 'windows-latest'
        type: choice
        options:
          - windows-latest
          - ubuntu-latest
      version:
        description: 'GMAT version'
        required: true
        default: 'R2026a'
        type: choice
        options:
          - R2022a
          - R2025a
          - R2026a

permissions:
  contents: read

jobs:
  install:
    name: install (${{ inputs.runs-on }} × ${{ inputs.version }})
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install GMAT
        id: install
        uses: ./
        with:
          version: ${{ inputs.version }}
          cache: false

      - name: Show install metadata
        shell: bash
        run: |
          echo "GMAT_ROOT=$GMAT_ROOT"
          echo "gmat-version=${{ steps.install.outputs.gmat-version }}"
          echo "cache-hit=${{ steps.install.outputs.cache-hit }}"

      - name: Confirm api_startup_file.txt is in place
        shell: bash
        run: test -f "$GMAT_ROOT/bin/api_startup_file.txt"
