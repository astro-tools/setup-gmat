name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly re-run of the self-test matrix to catch SourceForge URL drift,
  # mirror retirements, and installer-archive layout changes before
  # downstream consumers do. Mondays 06:00 UTC (low-traffic window).
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

      - name: Verify dist/ matches src/
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "::error::dist/ is out of date with src/. Run 'npm run build' locally and commit the result."
            git status dist
            git diff --stat dist
            exit 1
          fi

  self-test:
    name: self-test (${{ matrix.os }} / ${{ matrix.version }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        version: [R2022a, R2025a, R2026a]
        # R2022a's macOS DMG is x86_64-only (predates Apple Silicon support
        # entirely), and macos-latest is now arm64. The only free x86_64 macOS
        # runner left is macos-13, which is being deprecated and has very long
        # queue times. Skip the cell — the combo is genuinely unsupported by
        # NASA's upstream artifact on modern macOS hardware.
        exclude:
          - os: macos-latest
            version: R2022a
        # R2022a's Windows/macOS gmatpy builds ship _py36..._py39 only (Linux
        # adds _py310, but lowest-common-denominator wins). R2025a/R2026a both
        # ship _py312 across every platform.
        include:
          - version: R2022a
            python-version: '3.9'
          - version: R2025a
            python-version: '3.12'
          - version: R2026a
            python-version: '3.12'
    steps:
      - uses: actions/checkout@v5

      # Python 3.9 reached EOL 2025-10 and is no longer in the windows-latest
      # tool cache, so actions/setup-python's manifest install adds ~55s per
      # R2022a run. uv pulls 3.9 from python-build-standalone in seconds.
      - if: matrix.version == 'R2022a'
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - if: matrix.version != 'R2022a'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install GMAT (run 1)
        id: install-1
        uses: ./
        with:
          version: ${{ matrix.version }}
          cache: true

      - name: Snapshot install after run 1
        run: python .github/snapshot-install.py snapshot "${{ env.GMAT_ROOT }}" "${{ runner.temp }}/manifest-1.txt"

      - name: Reset install path
        run: python .github/snapshot-install.py reset "${{ env.GMAT_ROOT }}"

      - name: Install GMAT (run 2)
        id: install-2
        timeout-minutes: 1
        uses: ./
        with:
          version: ${{ matrix.version }}
          cache: true

      - name: Assert cache-hit on run 2
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.install-2.outputs.cache-hit }}" != "true" ]; then
            echo "::error::Expected cache-hit=true on run 2, got '${{ steps.install-2.outputs.cache-hit }}'"
            exit 1
          fi

      - name: Snapshot install after run 2
        run: python .github/snapshot-install.py snapshot "${{ env.GMAT_ROOT }}" "${{ runner.temp }}/manifest-2.txt"

      - name: Cache equivalence
        shell: bash
        run: |
          set -euo pipefail
          if ! diff -u "${RUNNER_TEMP}/manifest-1.txt" "${RUNNER_TEMP}/manifest-2.txt"; then
            echo "::error::Cache restore differs from cache-saved state"
            exit 1
          fi
          echo "Cache equivalence OK"
